name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      # The Handbook PDFs are not in the repository, so the real-data tests
      # are skipped here; the parser is tested on a synthetic PDF instead.
      - name: Test
        run: python -m pytest
